# Drop-in (Part 1): order the OBD consumer after the rfcomm link so
# /dev/rfcomm0 is more likely present at start. Wants, NOT Requires -- a flaky
# Bluetooth link must never take down the kiosk's backend; the reader
# retry-opens the port on its own. Non-destructive: the shipped unit is
# untouched.
[Unit]
After=obd-rfcomm.service
Wants=obd-rfcomm.service
